<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form đăng nhập</title>
        <link rel="stylesheet" href="bai11.css">
    </head>
    <body class="login">
        <form class="login__form">
            <h1 class="login__title">Form đăng nhập</h1>
            <div class="login__group">
                <label class="login__label" for="login__username-input">Tên người dùng:</label>
                <input class="login__input"
                    id="login__username-input"
                    type="text"
                    name="username"
                    value="Yến Trần"
                />
            </div>
            <div class="login__group">
                <label class="login__label" for="login__password-input">Mật khẩu:</label>
                <input class="login__input"
                    id="login__password-input"
                    type="password"
                    name="password"
                    value="******"
                />
            </div>
            <button class="login__submit" type="submit">Đăng nhập</button>
            <div class="login__welcome-message">Chào bạn <span>Yến Trần</span></div>
        </form>
    </body>
</html>
